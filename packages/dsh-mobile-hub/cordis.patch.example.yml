# Copy this file to `cordis.patch.yml` (gitignored).
# DeepSeek Harness exposes an authenticated localhost-only IPC server (127.0.0.1)
# to All in One Desktop App / Portable Bridge (which handles the single E2EE cloud link).
- insert:
    - id: mobile-hub
      name: dsh-mobile-hub
      config:
        # Optional default working directory for new chats
        cwd: ''
        # Default permission preset for new DSH sessions (safer workspace-write by default; opt-in to danger-full-access if needed)
        permissionPreset: 'workspace-write'
        # Pure zero-invasion bridge mode: keep false to avoid injecting extra tools / token overhead
        enableDispatchTools: false
        # Optional local status file for diagnostics
        # statusFile: '~/.dsh/allinone-mobile-hub-status.json'
