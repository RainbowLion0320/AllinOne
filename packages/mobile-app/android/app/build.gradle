import groovy.json.JsonSlurper

apply plugin: 'com.android.application'

def pkgJsonFile = file('../../package.json')
def pkgVersion = pkgJsonFile.exists() ? (new JsonSlurper().parseText(pkgJsonFile.text).version ?: '1.0.0') : '1.0.0'
def versionStr = pkgVersion.toString().trim().replaceFirst(/^[vV]/, '')
def buildSplit = versionStr.split('\\+', 2)[0]
def preSplit = buildSplit.split('-', 2)
def verParts = preSplit[0].split('\\.').collect { it.isInteger() ? it.toInteger() : 0 }
def verMajor = verParts.size() > 0 ? verParts[0] : 1
def verMinor = verParts.size() > 1 ? verParts[1] : 0
def verPatch = verParts.size() > 2 ? verParts[2] : 0
def preOffset = 99
if (preSplit.length > 1 && !preSplit[1].trim().isEmpty()) {
    def preTokens = preSplit[1].trim().split('\\.')
    def preTag = preTokens[0].toLowerCase(Locale.ROOT)
    def numToken = preTokens.length > 1 ? preTokens[1..-1].find { it ==~ /^\d+$/ } : null
    def preNum = numToken != null ? numToken.toInteger() : 0
    if (preTag == 'rc') {
        preOffset = 60 + Math.min(38, Math.max(0, preNum))
    } else if (preTag == 'beta') {
        preOffset = 30 + Math.min(29, Math.max(0, preNum))
    } else if (preTag == 'alpha') {
        preOffset = 10 + Math.min(19, Math.max(0, preNum))
    } else {
        def fallbackNum = (preTag ==~ /^\d+$/) ? preTag.toInteger() : preNum
        preOffset = Math.min(9, Math.max(1, fallbackNum > 0 ? fallbackNum : 1))
    }
}
def computedVersionCode = verMajor * 10000000 + verMinor * 100000 + verPatch * 100 + preOffset

def releaseKeystorePath = System.getenv("ANDROID_KEYSTORE_PATH")
def hasReleaseKeystore = releaseKeystorePath != null && !releaseKeystorePath.trim().isEmpty() && file(releaseKeystorePath).exists()

android {
    namespace "com.allinone.dshmobile"
    compileSdk rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.allinone.dshmobile"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode computedVersionCode
        versionName pkgVersion.toString()
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (hasReleaseKeystore) {
                storeFile file(releaseKeystorePath)
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS") ?: "allinone"
                keyPassword System.getenv("ANDROID_KEY_PASSWORD") ?: System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseKeystore) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
