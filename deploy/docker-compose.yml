services:
  allinone-relay:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:-}
        VITE_RELAY_URL: ${VITE_RELAY_URL:-}
        VITE_APK_URL: ${VITE_APK_URL:-}
    container_name: allinone-relay
    restart: unless-stopped
    environment:
      PORT: 8787
      HOST: 0.0.0.0
      # 请在同目录创建 .env 文件或直接替换下面的密钥（勿提交到 Git）
      CLIENT_ACCESS_TOKEN: ${CLIENT_ACCESS_TOKEN:?请设置手机访问密钥}
      BRIDGE_SECRET: ${BRIDGE_SECRET:?请设置PC桥接密钥}
      JWT_SECRET: ${JWT_SECRET:-}
      PUBLIC_RELAY_URL: ${PUBLIC_RELAY_URL:-}
      REGISTER_INVITE_CODE: ${REGISTER_INVITE_CODE:-}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-}
    volumes:
      - relay_data:/app/packages/relay-server/data
    ports:
      - "127.0.0.1:8787:8787"

  # 推荐：使用 Caddy 自动申请和续期 Let's Encrypt HTTPS/WSS 证书
  # 使用前先修改 deploy/Caddyfile 里的域名，并确保域名 DNS A 记录已指向本机
  caddy:
    image: caddy:2-alpine
    container_name: allinone-caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - allinone-relay

volumes:
  relay_data:
  caddy_data:
  caddy_config:
