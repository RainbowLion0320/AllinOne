name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-and-smoke:
    name: Build & Smoke Test (Node 22)
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build portable bridge & frontend
        run: npm run build

      - name: Verify portable bridge & setup scripts
        run: |
          test -s packages/mobile-app/dist/downloads/allinone-bridge.mjs
          test -s packages/mobile-app/dist/setup.sh
          test -s deploy/install.sh
          bash -n deploy/install.sh
          node -e "const fs = require('fs'); for (const p of ['packages/mobile-app/dist/setup.sh', 'deploy/install.sh']) { if (fs.readFileSync(p).includes(13)) { console.error(p + ' contains CR bytes'); process.exit(1); } }"

      - name: Run end-to-end smoke & security tests
        run: npm run test:smoke

  docker-check:
    name: Verify Relay Dockerfile
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -f deploy/Dockerfile -t allinone-relay:ci .

      - name: Verify built assets exist in image
        run: docker run --rm --entrypoint sh allinone-relay:ci -c "test -s /app/packages/mobile-app/dist/downloads/allinone-bridge.mjs && test -s /app/packages/mobile-app/dist/index.html && test -s /app/packages/mobile-app/dist/setup.sh"
