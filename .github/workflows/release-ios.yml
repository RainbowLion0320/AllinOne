name: Build & Upload iOS App (TestFlight / App Store)

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Optional default PUBLIC_RELAY_URL / VITE_RELAY_URL baked into the iOS bundle"
        required: false
        default: ""
      upload_testflight:
        description: "Upload signed IPA to App Store Connect / TestFlight (requires Apple signing secrets)"
        type: boolean
        required: false
        default: true

permissions:
  contents: read

jobs:
  build-ios:
    name: Build iOS (SPM + Xcode)
    runs-on: macos-latest
    env:
      PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      VITE_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify version sync across workspace & iOS Xcode project
        run: node scripts/bump-version.mjs --check

      - name: Install dependencies
        run: npm ci

      - name: Prepare iOS Capacitor SPM project
        run: npm run prepare:ios

      - name: Verify iOS runtime config (bundled-local, zero remote JS)
        run: cat packages/mobile-app/ios/App/App/capacitor.config.json

      - name: Detect Apple iOS signing secrets
        id: apple_signing
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -n "${IOS_DIST_CERT_BASE64:-}" ] && [ -n "${APPLE_API_KEY_BASE64:-}" ] && [ -n "${APPLE_API_KEY_ID:-}" ] && [ -n "${APPLE_API_ISSUER:-}" ]; then
            echo "has_signing=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_signing=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build Simulator sanity check (when Apple distribution secrets are not yet configured)
        if: steps.apple_signing.outputs.has_signing != 'true'
        run: |
          set -euo pipefail
          echo "::notice::Apple iOS distribution secrets not configured yet; running unsigned iOS Simulator build verification."
          xcodebuild \
            -project packages/mobile-app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Archive, sign & export iOS IPA
        if: steps.apple_signing.outputs.has_signing == 'true'
        env:
          IOS_DIST_CERT_BASE64: ${{ secrets.IOS_DIST_CERT_BASE64 }}
          IOS_DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
          APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
          UPLOAD_TESTFLIGHT: ${{ github.event_name == 'workflow_dispatch' && inputs.upload_testflight || true }}
        run: |
          set -euo pipefail
          KEYCHAIN_PATH="$RUNNER_TEMP/allinone-ios.keychain-db"
          KEYCHAIN_PASS="$(openssl rand -hex 24)"
          CERT_PATH="$RUNNER_TEMP/ios-dist.p12"
          ASC_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          ARCHIVE_PATH="$RUNNER_TEMP/AllinOne.xcarchive"
          EXPORT_DIR="$RUNNER_TEMP/ios-export"

          cleanup() {
            rm -f "$CERT_PATH" "$ASC_KEY_PATH" "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            security delete-keychain "$KEYCHAIN_PATH" 2>/dev/null || true
          }
          trap cleanup EXIT

          printf '%s' "$IOS_DIST_CERT_BASE64" | tr -d '\r\n ' | base64 --decode > "$CERT_PATH"
          printf '%s' "$APPLE_API_KEY_BASE64" | tr -d '\r\n ' | base64 --decode > "$ASC_KEY_PATH"
          chmod 600 "$CERT_PATH" "$ASC_KEY_PATH"

          security create-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$IOS_DIST_CERT_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security list-keychain -d user -s "$KEYCHAIN_PATH" login.keychain
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" "$KEYCHAIN_PATH"

          # Sync/create IOS_APP_STORE provisioning profile via App Store Connect API (zero device UDIDs needed)
          MANUAL_EXPORT_PLIST="$RUNNER_TEMP/ExportOptions.manual.plist"
          APPLE_API_KEY_PATH="$ASC_KEY_PATH" \
          APPLE_API_KEY_ID="$APPLE_API_KEY_ID" \
          APPLE_API_ISSUER="$APPLE_API_ISSUER" \
          EXPORT_PLIST_OUT="$MANUAL_EXPORT_PLIST" \
          node scripts/sync-ios-appstore-profile.mjs

          xcodebuild archive \
            -project packages/mobile-app/ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGN_STYLE=Manual \
            DEVELOPMENT_TEAM=37FM46Q69N \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            PROVISIONING_PROFILE_SPECIFIER="All in One App Store"

          xcodebuild -exportArchive \
            -archivePath "$ARCHIVE_PATH" \
            -exportPath "$EXPORT_DIR" \
            -exportOptionsPlist "$MANUAL_EXPORT_PLIST"

          mkdir -p packages/mobile-app/release
          IPA_PATH="$(find "$EXPORT_DIR" -maxdepth 2 -name '*.ipa' | head -n 1)"
          if [ -z "$IPA_PATH" ]; then
            echo "::error::Exported IPA not found under $EXPORT_DIR"
            exit 1
          fi
          cp "$IPA_PATH" packages/mobile-app/release/All-in-One-iOS.ipa
          ls -lh packages/mobile-app/release/All-in-One-iOS.ipa

          if [ "${UPLOAD_TESTFLIGHT}" = "true" ]; then
            mkdir -p "$HOME/.private_keys"
            cp "$ASC_KEY_PATH" "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            chmod 600 "$HOME/.private_keys/AuthKey_${APPLE_API_KEY_ID}.p8"
            xcrun altool --upload-app \
              --type ios \
              --file packages/mobile-app/release/All-in-One-iOS.ipa \
              --apiKey "$APPLE_API_KEY_ID" \
              --apiIssuer "$APPLE_API_ISSUER"
          fi

      - name: Upload signed iOS IPA artifact
        if: steps.apple_signing.outputs.has_signing == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: allinone-ios-ipa
          path: packages/mobile-app/release/All-in-One-iOS.ipa
          if-no-files-found: error
