name: Build Desktop & Android Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Optional default PUBLIC_RELAY_URL / VITE_RELAY_URL baked into the installers"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  test-gate:
    name: Build & Smoke Test Gate
    runs-on: ubuntu-latest
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Verify version sync across workspace
        run: node scripts/bump-version.mjs --check

      - name: Build & run all unit + E2E smoke tests
        run: npm run build && npm test

  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    needs: [test-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npm run pack:mac
            artifact_name: allinone-desktop-macos-arm64
            files: packages/desktop-app/release/*.dmg
          - os: windows-latest
            cmd: npm run pack:win
            artifact_name: allinone-desktop-windows-x64
            files: packages/desktop-app/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      VITE_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tagVer = String(process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            for (const p of ["package.json", "packages/desktop-app/package.json", "packages/mobile-app/package.json"]) {
              const v = JSON.parse(fs.readFileSync(p, "utf8")).version;
              if (v !== tagVer) {
                console.error(`Version mismatch: ${p} has ${v}, tag is v${tagVer}`);
                process.exit(1);
              }
            }
            console.log(`Verified all package versions match tag v${tagVer}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Package desktop installer
        run: ${{ matrix.cmd }}

      - name: Verify runtime config
        shell: bash
        run: cat packages/desktop-app/runtime-config.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    needs: [test-gate]
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      VITE_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Verify tag matches package versions
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        run: |
          node -e '
            const fs = require("fs");
            const tagVer = String(process.env.GITHUB_REF_NAME || "").replace(/^v/, "");
            for (const p of ["package.json", "packages/desktop-app/package.json", "packages/mobile-app/package.json"]) {
              const v = JSON.parse(fs.readFileSync(p, "utf8")).version;
              if (v !== tagVer) {
                console.error(`Version mismatch: ${p} has ${v}, tag is v${tagVer}`);
                process.exit(1);
              }
            }
            console.log(`Verified all package versions match tag v${tagVer}`);
          '

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android Capacitor project
        run: npm run prepare:android

      - name: Verify Android runtime config
        run: cat packages/mobile-app/android/app/src/main/assets/capacitor.config.json

      - name: Build & sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x packages/mobile-app/android/gradlew
          mkdir -p packages/mobile-app/release
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/allinone-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n ' | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            (cd packages/mobile-app/android && ./gradlew assembleRelease --no-daemon)
            APK_SRC="packages/mobile-app/android/app/build/outputs/apk/release/app-release.apk"
            APK_OUT="packages/mobile-app/release/All-in-One-Android.apk"
            OTA_SIGN_FLAG="--require-signature"
          else
            if [[ "${GITHUB_REF:-}" == refs/tags/v* ]]; then
              echo "::error::ANDROID_KEYSTORE_BASE64 secret is required for tagged releases (refusing to publish debug-signed APK)"
              exit 1
            fi
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; building debug APK for manual workflow_dispatch"
            (cd packages/mobile-app/android && ./gradlew assembleDebug --no-daemon)
            APK_SRC="packages/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk"
            APK_OUT="packages/mobile-app/release/All-in-One-Android-debug.apk"
            OTA_SIGN_FLAG="--allow-unsigned"
          fi
          cp "$APK_SRC" "$APK_OUT"
          APKSIGNER="$(ls -1 ${ANDROID_HOME}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs "$APK_OUT"
          fi
          node scripts/package-android-ota.mjs "$OTA_SIGN_FLAG"
          ls -lh packages/mobile-app/release/

      - name: Upload Android APK & OTA WebBundle artifacts
        uses: actions/upload-artifact@v4
        with:
          name: allinone-android-apk
          path: |
            packages/mobile-app/release/All-in-One-Android*.apk
            packages/mobile-app/release/All-in-One-WebBundle.zip
            packages/mobile-app/release/All-in-One-WebBundle.json
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Sign desktop installer manifest (Ed25519)
        env:
          DESKTOP_UPDATE_ED25519_PRIVATE_KEY: ${{ secrets.DESKTOP_UPDATE_ED25519_PRIVATE_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          DESKTOP_FILES=(release-artifacts/*.dmg release-artifacts/*.exe)
          if [ ${#DESKTOP_FILES[@]} -gt 0 ]; then
            node scripts/sign-desktop-release.mjs \
              --version "${GITHUB_REF_NAME#v}" \
              --out release-artifacts/All-in-One-Desktop-Release.json \
              "${DESKTOP_FILES[@]}"
          fi

      - name: Read Android OTA minNativeVersion metadata
        id: ota_meta
        shell: bash
        run: |
          set -euo pipefail
          MIN_NATIVE="$(node -e '
            const fs = require("fs");
            let v = "";
            if (fs.existsSync("release-artifacts/All-in-One-WebBundle.json")) {
              const m = JSON.parse(fs.readFileSync("release-artifacts/All-in-One-WebBundle.json", "utf8"));
              v = String(m.minNativeVersion || "").trim().replace(/^v/i, "");
            }
            if (!v && fs.existsSync("release-meta.json")) {
              const meta = JSON.parse(fs.readFileSync("release-meta.json", "utf8"));
              v = String(meta.androidMinNativeVersion || "").trim().replace(/^v/i, "");
            }
            if (!/^\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/.test(v)) {
              console.error("Invalid or missing androidOtaMinNative:", v);
              process.exit(1);
            }
            process.stdout.write(v);
          ')"
          echo "min_native=${MIN_NATIVE}" >> "$GITHUB_OUTPUT"
          echo "Resolved android-ota-min-native: ${MIN_NATIVE}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Downloads
            - **macOS (Apple Silicon)**: `All.in.One-*-arm64.dmg`
            - **Windows (x64)**: `All.in.One.Setup.*.exe`
            - **Android**: `All-in-One-Android.apk` (release-signed, camera QR scan enabled, cryptographically verified in-app OTA hot-updates via `All-in-One-WebBundle.zip`) or install via Mobile Browser PWA (**Add to Home Screen**).

            <!-- android-ota-min-native: ${{ steps.ota_meta.outputs.min_native }} -->

            > **macOS first launch**: Open-source builds are ad-hoc signed without an Apple Developer notarization certificate. If Gatekeeper blocks the first launch, allow it in **System Settings → Privacy & Security → Open Anyway**, or run `xattr -cr "/Applications/All in One.app"` once in Terminal.
          files: release-artifacts/*
