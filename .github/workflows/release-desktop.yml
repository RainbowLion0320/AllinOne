name: Build Desktop & Android Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Optional default PUBLIC_RELAY_URL / VITE_RELAY_URL baked into the installers"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  build-desktop:
    name: Build Desktop (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npm run pack:mac
            artifact_name: allinone-desktop-macos-arm64
            files: packages/desktop-app/release/*.dmg
          - os: windows-latest
            cmd: npm run pack:win
            artifact_name: allinone-desktop-windows-x64
            files: packages/desktop-app/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      VITE_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package desktop installer
        run: ${{ matrix.cmd }}

      - name: Verify runtime config
        shell: bash
        run: cat packages/desktop-app/runtime-config.json

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    env:
      PUBLIC_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      VITE_RELAY_URL: ${{ inputs.relay_url || vars.DEFAULT_RELAY_URL || '' }}
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Setup Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Install dependencies
        run: npm ci

      - name: Prepare Android Capacitor project
        run: npm run prepare:android

      - name: Verify Android runtime config
        run: cat packages/mobile-app/android/app/src/main/assets/capacitor.config.json

      - name: Build & sign Android APK
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          chmod +x packages/mobile-app/android/gradlew
          mkdir -p packages/mobile-app/release
          if [ -n "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/allinone-release.jks"
            printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ANDROID_KEYSTORE_PATH"
            trap 'rm -f "$ANDROID_KEYSTORE_PATH"' EXIT
            (cd packages/mobile-app/android && ./gradlew assembleRelease --no-daemon)
            APK_SRC="packages/mobile-app/android/app/build/outputs/apk/release/app-release.apk"
          else
            echo "::warning::ANDROID_KEYSTORE_BASE64 secret not set; falling back to debug-signed APK"
            (cd packages/mobile-app/android && ./gradlew assembleDebug --no-daemon)
            APK_SRC="packages/mobile-app/android/app/build/outputs/apk/debug/app-debug.apk"
          fi
          cp "$APK_SRC" packages/mobile-app/release/All-in-One-Android.apk
          APKSIGNER="$(ls -1 ${ANDROID_HOME}/build-tools/*/apksigner 2>/dev/null | sort -V | tail -n 1 || true)"
          if [ -n "$APKSIGNER" ]; then
            "$APKSIGNER" verify --print-certs packages/mobile-app/release/All-in-One-Android.apk
          fi
          ls -lh packages/mobile-app/release/All-in-One-Android.apk

      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: allinone-android-apk
          path: packages/mobile-app/release/All-in-One-Android.apk
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build-desktop, build-android]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          body: |
            ### Downloads
            - **macOS (Apple Silicon)**: `All.in.One-*-arm64.dmg`
            - **Windows (x64)**: `All.in.One.Setup.*.exe`
            - **Android**: `All-in-One-Android.apk` (release-signed, camera QR scan enabled, auto hot-updates UI) or install via Mobile Browser PWA (**Add to Home Screen**).

            > **macOS first launch**: Open-source builds are ad-hoc signed without an Apple Developer notarization certificate. If Gatekeeper blocks the first launch, allow it in **System Settings → Privacy & Security → Open Anyway**, or run `xattr -cr "/Applications/All in One.app"` once in Terminal.
          files: release-artifacts/*
