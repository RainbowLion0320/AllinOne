name: Build Desktop Installers

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      relay_url:
        description: "Optional default PUBLIC_RELAY_URL / VITE_RELAY_URL baked into the installers"
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build-desktop:
    name: Build (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            cmd: npm run pack:mac
            artifact_name: allinone-desktop-macos-arm64
            files: packages/desktop-app/release/*.dmg
          - os: windows-latest
            cmd: npm run pack:win
            artifact_name: allinone-desktop-windows-x64
            files: packages/desktop-app/release/*.exe
    runs-on: ${{ matrix.os }}
    env:
      PUBLIC_RELAY_URL: ${{ inputs.relay_url }}
      VITE_RELAY_URL: ${{ inputs.relay_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Package desktop installer
        run: ${{ matrix.cmd }}

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact_name }}
          path: ${{ matrix.files }}
          if-no-files-found: error

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-desktop
    runs-on: ubuntu-latest
    steps:
      - name: Download all installer artifacts
        uses: actions/download-artifact@v4
        with:
          path: release-artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: release-artifacts/*
