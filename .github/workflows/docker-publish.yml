name: Publish Relay Docker Image

on:
  push:
    branches: [main]
    tags:
      - "v*"
    paths:
      - "deploy/Dockerfile"
      - "packages/shared/**"
      - "packages/relay-server/**"
      - "packages/dsh-mobile-hub/**"
      - "packages/mobile-app/**"
      - "scripts/**"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/docker-publish.yml"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-and-push:
    name: Build & Push Multi-Arch Image (GHCR)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/allinone-relay
          labels: |
            org.opencontainers.image.title=All in One Relay Server
            org.opencontainers.image.description=Zero-knowledge E2EE pure control-plane & WebRTC P2P/TURN signaling server for Codex, Claude Code, Antigravity, and DeepSeek Harness
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.licenses=MIT
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-

      - name: Build and push multi-arch image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
